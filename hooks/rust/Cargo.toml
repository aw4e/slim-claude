[package]
name = "slim-hook"
version = "0.1.0"
edition = "2021"
description = "Fast Rust port of the slim-claude hooks. Optional; the Node hooks are the default."

[dependencies]
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
